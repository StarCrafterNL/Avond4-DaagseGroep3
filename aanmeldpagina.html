<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanmeldpagina</title>
    <link rel="stylesheet" href="css/basis.css">
    <link rel="stylesheet" href="css/formulier.css">
    <link rel="stylesheet" href="css/navigatie.css">
</head>
<body>

    <!-- hier een container gemaakt, links de zijbalk waar sponsers komen en recht het formulier -->
    <main class="form-container">
        
        <!-- LINKS: De Zijbalk voor de sponsooren -->
        <aside class="zijbalk">
            <!-- hier de hardloop foto geplaats -->
            <div class="logo-sport"> 
                <img src="img/hardloop.jpg" alt="Hardloop foto">
            </div> 
            
            <!-- hier komen de sponsoren heb het alvast als placeholder gemaakt -->
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
        </aside>

        <!-- RECHTS: hier komen de menu en het formulier -->
        <section class="hoofd-inhoud">
            
            <!-- Het navigatiemenu dat gecenterd komt te sttaan  -->
            <nav class="navigatie">
                <a href="#">Routes</a>
                <a href="#">Reglement</a>
                <a href="#">Handboek</a>
                <a href="#">Contact</a>
                <a href="#">Privacy</a>
                <a href="inlogpagina.html">Login</a>  <!-- deze erin gezet maar even besprken of dit nodig is -->
            </nav>

            <h2>Aanmeldingsformulier:</h2>

            <!-- hier dus het formulier aangemaaktt  -->
            <form action="/verwerk-registratie" method="POST">
                
                <div class="form-groep">
                    <label for="naam">Volledige naam:</label>
                    <input type="text" id="naam" name="naam" required placeholder="Jan Jansen">
                </div>

                <div class="form-groep">
                    <label for="email">E-mailadres:</label>
                    <input type="email" id="email" name="email" required placeholder="naam@voorbeeld.nl">
                </div>

                <div class="form-groep">
                    <label for="wachtwoord">Wachtwoord:</label> 
                    <input type="password" id="wachtwoord" name="wachtwoord" required placeholder="Kies een sterk wachtwoord">
                </div>

                <!-- Checkbox voor de nieuwsbrief uit het voorbeeld -->
                <div class="nieuwsbrief-optie">
                    <input type="checkbox" id="nieuwsbrief" name="nieuwsbrief">
                    <label for="nieuwsbrief">Ja, ik wil mijzelf aanmelden voor een nieuwsbrief.</label>
                </div>

                <button type="submit">Account aanmaken</button>
            </form>

            <!-- hier word dus de switch gemaakt van aanmaak naar inlogpagian als je erop klikt -->
            <p class="form-switch">
                Heb je al een account? <a href="inlogpagina.html">Log hier in</a>.
            </p>
        </section>

    </main>

</body>
</html>
