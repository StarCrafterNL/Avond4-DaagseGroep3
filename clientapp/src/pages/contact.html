<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Avond4daagse</title>

    <!-- Algemene stylesheet -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- Navigatie -->
    <header>
        <nav>
            <a href="index.html" class="logo">
                Avond4daagse
            </a>

            <ul class="nav-links">
                <li><a href="#">Routes</a></li>
                <li><a href="/clientapp/src/pages/reglement.html">Reglement</a></li>
                <li><a href="#">Handboek</a></li>
                <li><a href="/clientapp/src/pages/contact.html" class="active">Contact</a></li>
                <li><a href="/clientapp/src/pages/privacy.html">Privacy</a></li>
                <li><a href="/clientapp/src/pages/inlogpagina.html">Login</a></li>
                <li><a href="/clientapp/src/pages/aanmeldpagina.html">Aanmelden</a></li>
                <li><a href="/clientapp/src/pages/homepage.html" class="active">Home</a></li>
            </ul>
        </nav>
    </header>


    <!-- Pagina inhoud -->
    <main class="page-container">

        <!-- Sponsoren -->
        <aside class="sponsors">

            <h2>Sponsoren</h2>

            <div class="sponsor">
                Sponsor
            </div>

            <div class="sponsor">
                Sponsor
            </div>

            <div class="sponsor">
                Sponsor
            </div>

            <div class="sponsor">
                Sponsor
            </div>

        </aside>


        <!-- Contact -->
        <section class="contact-section">

            <h1>Contact</h1>

            <p class="contact-intro">
                Heb je een vraag over de Avond4daagse?
                Vul het onderstaande contactformulier in.
                We nemen zo snel mogelijk contact met je op.
            </p>


            <!-- Contactformulier -->
            <form class="contact-form">

                <!-- Naam -->
                <div class="form-group">

                    <label for="naam">
                        Naam
                    </label>

                    <input
                        type="text"
                        id="naam"
                        name="naam"
                        placeholder="Vul je naam in"
                        required
                    >

                </div>


                <!-- E-mail -->
                <div class="form-group">

                    <label for="email">
                        E-mailadres
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Vul je e-mailadres in"
                        required
                    >

                </div>


                <!-- Bericht -->
                <div class="form-group">

                    <label for="bericht">
                        Bericht
                    </label>

                    <textarea
                        id="bericht"
                        name="bericht"
                        placeholder="Typ hier je bericht"
                        required
                    ></textarea>

                </div>


                <!-- Verzenden -->
                <button
                    type="submit"
                    class="submit-button"
                >
                    Verzenden
                </button>

            </form>

        </section>

    </main>

</body>

</html>
