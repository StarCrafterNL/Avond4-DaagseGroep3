<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen</title>
    <link rel="stylesheet" href="../../../css/basis.css">
    <link rel="stylesheet" href="../../../css/formulier.css">
    <link rel="stylesheet" href="../../../css/navigatie.css">
</head>
<body>

     <main class="form-container">

        <!-- LINKS: De Zijbalk voor de sponsoren -->
        <aside class="zijbalk">
            <div class="logo-sport"> 
                <img src="../../../image/hardloop.jpg" alt="Hardloop foto">
            </div> 
            
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
        </aside>

        <!-- RECHTS: Het menu en het formulier -->
        <section class="hoofd-inhoud">
            
            <div class="nav-wrapper">
                <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="login-main-menu" aria-label="Menu openen">
                    ☰
                </button>

                <nav class="navigatie" id="login-main-menu" aria-label="Hoofdnavigatie">
                    <a href="routes.html">Routes</a>
                    <a href="reglement.html">Reglement</a>
                    <a href="handboek.html">Handboek</a>
                    <a href="contact.html">Contact</a>
                    <a href="privacy.html">Privacy</a>
                    <a href="inlogpagina.html" aria-current="page">Login</a>
                    <a href="aanmeldpagina.html">Aanmelden</a>
                    <a href="../../../index.html">Home</a>
                </nav>
            </div>

            <h2>Inloggen</h2>
            <p class="form-welkom">Welkom terug! Log in met je gegevens.</p>

            <!-- Foutmelding voor het acceptatiecriterium -->
            <p id="login-foutmelding" role="alert" style="color: #d93025; font-weight: bold; display: none; margin-bottom: 1rem;"></p>

            <!-- Het Inlogformulier -->
            <form action="/verwerk-login" method="POST"> 
                
                <!-- E-mailadres -->
                <div class="form-groep">
                    <label for="email">E-mailadres:</label>
                    <input type="email" id="email" name="email" required placeholder="naam@voorbeeld.nl">
                </div>

                <!-- Wachtwoord -->
                <div class="form-groep">
                    <label for="wachtwoord">Wachtwoord:</label>
                    <input type="password" id="wachtwoord" name="wachtwoord" required placeholder="Je wachtwoord">
                </div>

                <!-- Actieknop -->
                <button type="submit">Inloggen</button>
            </form>

            <!-- De link naar de aanmeldpagina -->
            <p class="form-switch">
                Nog geen account? <a href="aanmeldpagina.html">Meld je hier aan</a>.
            </p>
        </section>
     </main>

     <script>
        const navToggle = document.querySelector(".nav-toggle");
        const navMenu = document.querySelector(".navigatie");

        if (navToggle && navMenu) {
            navToggle.addEventListener("click", function () {
                const isOpen = navMenu.classList.toggle("open");
                navToggle.setAttribute("aria-expanded", isOpen);
                navToggle.textContent = isOpen ? "✕" : "☰";
                navToggle.setAttribute("aria-label", isOpen ? "Menu sluiten" : "Menu openen");
            });
        }

        // Acceptatiecriterium: Exacte foutmelding bij onjuiste gegevens
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("error") === "ongeldig") {
            const foutElement = document.getElementById("login-foutmelding");
            foutElement.textContent = "Ongeldige combinatie van e-mailadres en wachtwoord";
            foutElement.style.display = "block";
        }
    </script>

    <!-- Gedeeld sessie-script -->
    <script src="/js/sessie.js"></script>

</body>
</html>
