<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen</title>
    <link rel="stylesheet" href="/css/basis.css">
    <link rel="stylesheet" href="/css/formulier.css">
    <link rel="stylesheet" href="/css/navigatie.css">
</head>
<body>

     <main class="form-container">

        <!-- LINKS: De Zijbalk voor de sponsooren -->
        <aside class="zijbalk">
            <!-- hier de hardloop foto geplaats -->
            <div class="logo-sport"> 
                <img src="/image/hardloop.jpg" alt="Hardloop foto">
            </div> 
            
            <!-- hier komen de sponsoren heb het alvast als placeholder gemaakt -->
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
            <div class="sponsor-blokje">Sponsor</div>
        </aside>

        <!-- RECHTS: hier komen de menu en het formulier -->
        <section class="hoofd-inhoud">
            
            <!-- Het navigatiemenu dat gecenterd komt te sttaan  -->
            <!-- Het navigatiemenu -->
            <div class="nav-wrapper">
                <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="login-main-menu" aria-label="Menu openen">
                ☰
            </button>

            <nav class="navigatie" id="login-main-menu" aria-label="Hoofdnavigatie">
                <a href="/clientapp/src/pages/routes.html">Routes</a>
                <a href="/clientapp/src/pages/reglement.html">Reglement</a>
                <a href="/clientapp/src/pages/handboek.html">Handboek</a>
                <a href="/clientapp/src/pages/contact.html">Contact</a>
                <a href="/clientapp/src/pages/privacy.html">Privacy</a>
                <a href="/clientapp/src/pages/inlogpagina.html" aria-current="page">Login</a>
                <a href="/clientapp/src/pages/aanmeldpagina.html">Aanmelden</a>
                <a href="/index.html">Home</a>
            </nav>
            </div>


            <h2>Inloggen</h2>
            <p class="form-welkom">Welkom terug! Log in met je gegevens.</p>

            <!-- Het Inlogformulier -->
            <form action="/verwerk-login" method="POST"> 
                
                <!-- E-mailadres -->
                <div class="form-groep">
                    <label for="email">E-mailadres:</label>
                    <input type="email" id="email" name="email" required placeholder="naam@voorbeeld.nl">
                </div>

                <!-- Wachtwoord -->
                <div class="form-groep">
                    <label for="wachtwoord">Wachtwoord:</label>
                    <input type="password" id="wachtwoord" name="wachtwoord" required placeholder="Je wachtwoord">
                </div>

                <!-- Actieknop -->
                <button type="submit">Inloggen</button>
            </form>

            <!-- De link naar de aanmeldpagina -->
            <p class="form-switch">
                Nog geen account? <a href="aanmeldpagina.html">Meld je hier aan</a>.
            </p>
        </section>
     </main>
     <script>
        const navToggle = document.querySelector(".nav-toggle");
        const navMenu = document.querySelector(".navigatie");

        if (navToggle && navMenu) {
            navToggle.addEventListener("click", function () {
                const isOpen = navMenu.classList.toggle("open");
                navToggle.setAttribute("aria-expanded", isOpen);
                navToggle.textContent = isOpen ? "✕" : "☰";
                navToggle.setAttribute("aria-label", isOpen ? "Menu sluiten" : "Menu openen");
            });
        }
    </script>


</body>
</html>
