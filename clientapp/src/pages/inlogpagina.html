<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inloggen bij Avond4daagse.">

    <title>Inloggen | Avond4daagse</title>

    <!-- Algemene styling van de website -->
    <link rel="stylesheet" href="../../../css/info-pages.css">

    <!-- Styling specifiek voor de loginpagina -->
    <link rel="stylesheet" href="../../../css/inloggen.css">
</head>

<body class="info-page login-page">

    <!-- Navigatie -->
    <header class="site-header">
        <div class="nav">

            <div class="nav-top">
                <a href="../../../index.html" class="logo">
                    Avond4daagse
                </a>

                <button
                    type="button"
                    class="nav-toggle"
                    aria-expanded="false"
                    aria-controls="info-main-menu"
                    aria-label="Menu openen">
                    ☰
                </button>
            </div>

            <nav
                class="main-nav"
                id="info-main-menu"
                aria-label="Hoofdnavigatie">

                <a href="routes.html">Routes</a>
                <a href="reglement.html">Reglement</a>
                <a href="handboek.html">Handboek</a>
                <a href="contact.html">Contact</a>
                <a href="privacy.html">Privacy</a>
                <a href="inlogpagina.html" aria-current="page">Login</a>
                <a href="aanmeldpagina.html">Aanmelden</a>
                <a href="../../../index.html">Home</a>

            </nav>

        </div>
    </header>


    <!-- Pagina layout -->
    <div class="page-layout">

        <!-- Sponsoren -->
        <aside class="sponsor-sidebar" aria-label="Sponsoren">

            <h2>Sponsoren</h2>

            <div class="sponsor-list">
                <div class="sponsor-item">Sponsor</div>
                <div class="sponsor-item">Sponsor</div>
                <div class="sponsor-item">Sponsor</div>
                <div class="sponsor-item">Sponsor</div>
                <div class="sponsor-item">Sponsor</div>
            </div>

        </aside>


        <!-- Login gedeelte -->
        <main class="page-main login-main">

            <h1>Inloggen</h1>

            <div class="login-card">

                <form action="/verwerk-login" method="POST">

                    <!-- E-mailadres -->
                    <div class="login-field">

                        <label for="email">
                            E-mailadres
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Vul je e-mailadres in"
                            required>

                    </div>


                    <!-- Wachtwoord -->
                    <div class="login-field">

                        <label for="wachtwoord">
                            Wachtwoord
                        </label>

                        <input
                            type="password"
                            id="wachtwoord"
                            name="wachtwoord"
                            placeholder="Vul je wachtwoord in"
                            required>

                    </div>


                    <!-- Wachtwoord vergeten -->
                    <a href="#" class="forgot-password">
                        Wachtwoord vergeten?
                    </a>


                    <!-- Inloggen -->
                    <button
                        type="submit"
                        class="login-button">

                        Inloggen

                    </button>

                </form>

            </div>


            <!-- Account aanmaken -->
            <p class="login-register">

                Nog geen account?
                <a href="aanmeldpagina.html">
                    Aanmelden
                </a>

            </p>

        </main>

    </div>


    <!-- Mobiele navigatie -->
    <script>

        const navToggle = document.querySelector(".nav-toggle");
        const mainNav = document.querySelector(".main-nav");

        if (navToggle && mainNav) {

            navToggle.addEventListener("click", function () {

                const isOpen = mainNav.classList.toggle("open");

                navToggle.setAttribute(
                    "aria-expanded",
                    isOpen
                );

                navToggle.textContent =
                    isOpen ? "✕" : "☰";

                navToggle.setAttribute(
                    "aria-label",
                    isOpen
                        ? "Menu sluiten"
                        : "Menu openen"
                );

            });

        }

    </script>

</body>

</html>
